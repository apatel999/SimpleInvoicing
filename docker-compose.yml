services:
  web:
    build:
      context: ./docker/php
    container_name: simpleinvoicing-web
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./app:/var/www/html
    environment:
      DB_HOST: db
      DB_NAME: ${MYSQL_DATABASE}
      DB_USER: ${MYSQL_USER}
      DB_PASS: ${MYSQL_PASSWORD}
      APP_URL: ${APP_URL:-http://localhost:8080}
      APP_SECRET: ${APP_SECRET}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web-saas:
    build:
      context: ./docker/php
    container_name: simpleinvoicing-saas
    ports:
      - "${SAAS_PORT:-8084}:80"
    volumes:
      - ./app-saas:/var/www/html
    environment:
      DB_HOST: db
      DB_NAME: ${SAAS_DATABASE:-invoicehost}
      DB_USER: ${MYSQL_USER}
      DB_PASS: ${MYSQL_PASSWORD}
      APP_URL: ${SAAS_URL:-http://localhost:8084}
      APP_SECRET: ${APP_SECRET}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: mariadb:11.4
    container_name: simpleinvoicing-db
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - ./data/mysql:/var/lib/mysql
      - ./app/sql/install.sql:/docker-entrypoint-initdb.d/01-install.sql:ro
    environment:
      MARIADB_DATABASE: ${MYSQL_DATABASE}
      MARIADB_USER: ${MYSQL_USER}
      MARIADB_PASSWORD: ${MYSQL_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  phpmyadmin:
    image: phpmyadmin:5
    container_name: simpleinvoicing-pma
    ports:
      - "${PHPMYADMIN_PORT:-8081}:80"
    environment:
      PMA_HOST: db
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
